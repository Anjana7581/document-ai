<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodertechPRO Assistant</title>
<style>
:root{--ink:#14143c;--muted:#8b8fb5;--line:#e4e4f1;--grad:linear-gradient(135deg,#1d5fd6,#6a4cf0)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,"Segoe UI",Roboto,sans-serif;background:#faf3e8;color:var(--ink)}
.hero{padding:48px 24px;text-align:center}
.hero h1{margin:0 0 8px;font-size:28px}
.hero p{margin:0;color:var(--muted)}
button{font:inherit;cursor:pointer}
#launcher{position:fixed;right:24px;bottom:24px;width:60px;height:60px;border:0;border-radius:50%;background:var(--grad);color:#fff;font-size:26px;box-shadow:0 8px 24px rgba(80,70,220,.35)}
#widget{position:fixed;right:24px;bottom:24px;width:390px;max-width:calc(100vw - 24px);display:none;flex-direction:column;gap:10px}
#widget.open{display:flex}
#widget.big{width:600px}
#panel{height:min(540px,calc(100vh - 150px));border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(60,60,140,.25);
background:radial-gradient(120% 55% at 20% 0%,#d9e0ff,rgba(217,224,255,0) 70%),radial-gradient(90% 45% at 85% 35%,#f0dbff,rgba(240,219,255,0) 70%),radial-gradient(110% 50% at 35% 62%,#ffe8d0,rgba(255,232,208,0) 70%),#f8f8fd}
#widget.big #panel{height:calc(100vh - 150px)}
header{display:flex;align-items:center;gap:8px;padding:18px 20px 8px}
header b{font-size:20px}
.ai{background:#7b3fd6;color:#fff;font-size:12px;font-weight:700;border-radius:7px;padding:2px 7px}
header .sp{flex:1}
.ic{border:0;background:none;color:#8b8fb5;font-size:20px;padding:4px 6px}
#welcome{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;text-align:center}
#welcome h2{margin:0 0 28px;font-size:30px;line-height:1.2}
.sug{display:flex;align-items:center;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;padding:14px 4px;font-size:16px}
.sug i{font-style:normal;width:30px;text-align:center;font-size:20px}
.mascot{font-size:72px;line-height:1;margin-top:18px}
#msgs{display:none;flex:1;overflow-y:auto;padding:8px 18px 14px;flex-direction:column;gap:10px}
.chatting #welcome{display:none}
.chatting #msgs{display:flex}
.m{max-width:85%;padding:10px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.typing{display:flex;gap:5px;padding:14px}
.typing span{width:7px;height:7px;border-radius:50%;background:#b5b8d6;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
#bar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:28px;padding:10px 10px 10px 20px;box-shadow:0 8px 30px rgba(80,70,200,.18);border:1px solid #e9e6fb}
#q{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:17px;color:var(--ink);background:none;padding:8px 0}
#q::placeholder{color:#a3a6c8}
#go{border:0;border-radius:22px;background:var(--grad);color:#fff;font-weight:600;font-size:16px;padding:11px 22px}
#go:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="hero"><h1>CodertechPRO</h1><p>Algo Trading &amp; Robotics, Kochi. Chat with our assistant using the button at the bottom right.</p></div>

<button id="launcher" aria-label="Open chat" title="Chat with CodertechPRO AI">🤖</button>

<div id="widget">
  <div id="panel">
    <header>
      <b>CodertechPRO</b><span class="ai">AI</span><span class="sp"></span>
      <button class="ic" id="big" aria-label="Expand">⤢</button>
      <button class="ic" id="close" aria-label="Close">✕</button>
    </header>
    <div id="welcome">
      <h2>Hey, how can I help?</h2>
      <button class="sug" data-q="What courses do you offer?"><i>❓</i>What courses do you offer?</button>
      <button class="sug" data-q="How much is the Python course fee?"><i>🎓</i>How much is the Python course fee?</button>
      <button class="sug" data-q="When does the next batch start?"><i>📅</i>When does the next batch start?</button>
      <div class="mascot">🤖</div>
    </div>
    <div id="msgs" aria-live="polite"></div>
  </div>
  <div id="bar">
    <input id="q" type="text" placeholder="Ask CodertechPRO anything" maxlength="1000" autocomplete="off">
    <button id="go" disabled>Send</button>
  </div>
</div>

<script>
const API_URL = "/api/chat";
const PHONE = "+91 9037010647";
const $ = s => document.querySelector(s);
const widget = $("#widget"), panel = $("#panel"), msgs = $("#msgs"), q = $("#q"), go = $("#go");
let busy = false;

function toggle(open) {
  widget.classList.toggle("open", open);
  $("#launcher").style.display = open ? "none" : "";
  if (open) q.focus();
}
function sync() {
  go.disabled = busy || !q.value.trim();
}
function add(text, cls) {
  const d = document.createElement("div");
  d.className = "m " + cls;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}
async function ask(text) {
  text = text.trim();
  if (!text || busy) return;
  panel.classList.add("chatting");
  add(text, "me");
  q.value = "";
  busy = true; sync();
  const wait = add("", "bot typing");
  wait.innerHTML = "<span></span><span></span><span></span>";
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 180000);
  let reply = "Sorry, I’m having trouble right now. Please call or WhatsApp us on " + PHONE + ".";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: text }),
      signal: ctl.signal
    });
    const data = await res.json();
    if (res.ok && data.answer) reply = data.answer;
  } catch (e) { /* keep the friendly fallback message */ }
  clearTimeout(timer);
  wait.className = "m bot";
  wait.textContent = reply;
  msgs.scrollTop = msgs.scrollHeight;
  busy = false; sync(); q.focus();
}
$("#launcher").onclick = () => toggle(true);
$("#close").onclick = () => toggle(false);
$("#big").onclick = () => widget.classList.toggle("big");
document.querySelectorAll(".sug").forEach(b => b.onclick = () => ask(b.dataset.q));
go.onclick = () => ask(q.value);
q.addEventListener("input", sync);
q.addEventListener("keydown", e => { if (e.key === "Enter") ask(q.value); });
sync();
toggle(false);
</script>
</body>
</html>
